<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}EBR{% endblock %} · Yobel EBR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilo_yobel.css">
    {% block estilos %}{% endblock %}
</head>
<body>
<div class="app" id="app">
    <!-- ================= BARRA LATERAL ================= -->
    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
        <div class="sidebar-marca">
            <span class="logo">yobel<small>EBR</small></span>
        </div>
        <nav class="sidebar-nav">
            <a href="/ebr/principal" class="nav-item {% if menu_activo == 'inicio' %}activo{% endif %}" title="Inicio">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
                <span class="texto-nav">Inicio</span>
            </a>

            <p class="nav-seccion">Producción</p>
            <a href="/ebr/repositorio-ordenes" class="nav-item {% if menu_activo == 'ordenes' %}activo{% endif %}" title="Órdenes de trabajo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v3h6V3"/><path d="M9 11h6M9 15h6"/></svg>
                <span class="texto-nav">Órdenes de trabajo</span>
            </a>
            <span class="nav-item deshabilitado" title="Desarrollo de órdenes (CU-04, próximamente)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M6 16l4-8 4 5 4-9"/></svg>
                <span class="texto-nav">Desarrollo de órdenes</span>
                <span class="pronto">CU-04</span>
            </span>
        </nav>
        <div class="sidebar-pie">
            <button type="button" class="nav-item" id="btnCerrarSesion" title="Cerrar sesión">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                <span class="texto-nav">Cerrar sesión</span>
            </button>
        </div>
    </aside>
    <div class="velo" id="velo"></div>

    <!-- ================= CONTENIDO ================= -->
    <div class="contenido-app">
        <header class="topbar">
            <button type="button" class="btn-menu" id="btnMenu" aria-label="Mostrar u ocultar el menú">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="topbar-titulo">{% block titulo_barra %}{% endblock %}</div>
            <div class="usuario-chip">
                <strong id="usuarioNombre"></strong>
                <span id="usuarioRol"></span>
            </div>
        </header>
        <main class="pagina">
            {% block contenido %}{% endblock %}
        </main>
    </div>
</div>

<script src="/static/js/ebr_app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
